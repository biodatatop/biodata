<!DOCTYPE html>

<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Daftar - Biodata</title>

<meta
name="description"
content="Buat akun Biodata gratis dan bagikan semua link Anda dalam satu halaman.">

<meta
name="robots"
content="noindex,nofollow">

<link
rel="canonical"
href="/register.html">

<link
rel="icon"
href="/assets/favicon.svg">

<meta
property="og:title"
content="Daftar - Biodata">

<meta
property="og:description"
content="Buat akun Biodata gratis">

<meta
property="og:type"
content="website">

<link
rel="stylesheet"
href="/css/style.css">

<link
rel="stylesheet"
href="/css/auth.css">

<script>
if(localStorage.getItem("token")){
location.href="/dashboard.html";
}
</script>

</head>

<body class="auth-page">

<div class="auth-card">

<div class="auth-logo">
Biodata
</div>

<p class="auth-subtitle">
Buat akun gratis dalam beberapa detik
</p>

<form id="registerForm">

<div class="form-group">

<label>
Username
</label>

<input
type="text"
id="username"
required
minlength="3"
maxlength="20"
autocomplete="username"
placeholder="contoh: andi">

<small>
URL profil:
Biodata.pages.dev/username
</small>

</div>

<div class="form-group">

<label>
Nama
</label>

<input
type="text"
id="name"
required
maxlength="100"
autocomplete="name"
placeholder="Nama Lengkap">

</div>

<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="password"
required
minlength="6"
autocomplete="new-password"
placeholder="Minimal 6 karakter">

</div>

<div class="form-group">

<label>
Konfirmasi Password
</label>

<input
type="password"
id="confirm-password"
required
autocomplete="new-password"
placeholder="Ulangi password">

</div>

<button
type="submit"
class="btn btn-primary btn-block">

Buat Akun

</button>

</form>

<div
id="message"
class="message">
</div>

<div class="auth-footer">

Sudah punya akun?

<a href="/login.html">
Login
</a>

</div>

</div>

<script src="/js/api-config.js"></script>
<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/register.js"></script>

</body>
</html>
