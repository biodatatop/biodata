<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Biodata</title>

<meta name="description"
content="Masuk ke akun Biodata untuk mengelola profil dan link Anda.">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
font-family:system-ui,sans-serif;
background:#f8fafc;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.card{
width:100%;
max-width:420px;
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:30px
}

.logo{
text-align:center;
font-size:28px;
font-weight:700;
margin-bottom:10px
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:25px
}

.form-group{
margin-bottom:15px
}

label{
display:block;
margin-bottom:6px;
font-weight:600
}

input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:15px
}

input:focus{
outline:none;
border-color:#111827
}

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:#111827;
color:#fff;
font-size:15px;
font-weight:600;
cursor:pointer
}

button:hover{
opacity:.9
}

.message{
margin-top:15px;
padding:12px;
border-radius:10px;
display:none
}

.error{
background:#fee2e2;
color:#991b1b
}

.success{
background:#dcfce7;
color:#166534
}

.footer{
margin-top:20px;
text-align:center;
font-size:14px
}

.footer a{
text-decoration:none;
font-weight:600
}
</style>
</head>
<body>

<div class="card">

<div class="logo">Biodata</div>

<p class="subtitle">
Masuk ke akun Anda
</p>

<form id="loginForm">

<div class="form-group">
<label>Username</label>
<input
type="text"
id="username"
required
placeholder="Username">
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
id="password"
required
placeholder="Password">
</div>

<button type="submit">
Masuk
</button>

</form>

<div id="message" class="message"></div>

<div class="footer">
Belum punya akun?
<a href="/register.html">
Daftar
</a>
</div>

</div>

<script>

const API =
"https://api-biolink.lebahhack.workers.dev";

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");

function showMessage(text,type){

message.style.display="block";
message.className=`message ${type}`;
message.textContent=text;

}

form.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

try{

const res = await fetch(
`${API}/login`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
}
);

const data =
await res.json();

if(!res.ok){

showMessage(
data.message || "Login gagal",
"error"
);

return;

}

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"user",
data.username
);

showMessage(
"Login berhasil...",
"success"
);

setTimeout(()=>{

location.href =
"/dashboard.html";

},1000);

}catch(err){

showMessage(
"Gagal terhubung ke server",
"error"
);

}

});
</script>

</body>
</html>
