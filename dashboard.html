<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dashboard | Biodata</title>

<meta
name="description"
content="Kelola profil, avatar, dan semua link Biodata Anda dari dashboard.">

<meta
name="robots"
content="noindex,nofollow">

<link
rel="icon"
href="/assets/favicon.svg">

<link
rel="stylesheet"
href="/css/style.css">

<link
rel="stylesheet"
href="/css/dashboard.css">

</head>
<body>

<header class="site-header">

<div class="container">

<div class="header-inner">

<a
href="/"
class="logo">

Biodata

</a>

<div class="header-actions">

<button
type="button"
class="btn btn-secondary"
onclick="openProfile()">

Lihat Profil

</button>

<button
type="button"
class="btn btn-primary"
onclick="logout()">

Logout

</button>

</div>

</div>

</div>

</header>

<main class="dashboard">

<div class="container">

<div class="dashboard-grid">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="profile-card">

<img
id="avatar-preview"
class="avatar-preview"
src="/assets/avatar-default.svg"
alt="Avatar">

<h3
id="profile-name-preview">

Memuat...

</h3>

<p id="sidebar-username">

@username

</p>

<p id="profile-bio-preview"></p>

<div id="profile-links-preview"></div>
  
</div>

<div class="stats-box">

<div>

Total Link:
<strong id="total-links">
0
</strong>

</div>

</div>

<div class="sidebar-actions">

<button
type="button"
class="btn btn-block btn-secondary"
onclick="copyMyProfile()">

Salin Link Profil

</button>

<button
type="button"
class="btn btn-block btn-primary"
onclick="openProfile()">

Buka Profil

</button>

</div>

</aside>

<!-- CONTENT -->

<section class="content">

<h2 class="section-title">

Pengaturan Profil

</h2>

<div class="form-group">

<label for="profile-name">
Nama
</label>

<input
type="text"
id="profile-name"
placeholder="Nama Anda">

</div>

<div class="form-group">

<label for="profile-bio">
Bio
</label>

<textarea
id="profile-bio"
rows="4"
placeholder="Tulis bio singkat"></textarea>

</div>

<div class="form-group">

<label for="profile-avatar">
Avatar URL (Opsional)
</label>

<input
type="url"
id="profile-avatar"
placeholder="https://...">

<small>

Kosongkan untuk menggunakan avatar otomatis Biodata.

</small>

</div>


  <div class="form-group">

<label for="profile-theme">
Theme
</label>

<select id="profile-theme">

<option value="default">
  Default
</option>

<option value="glass">
  Glass
</option>

<option value="minimal">
  Minimal
</option>

<option value="neon">
  Neon
</option>

<option value="card">
  Card
</option>

<option value="premium">
  Premium
</option>

<option value="social">
  Social
</option>
  
</select>

<small>

Pilih tampilan profil publik Anda.

</small>

</div>
  

  
<button
type="button"
class="btn btn-primary"
onclick="saveProfile()">

Simpan Profil

</button>

<hr>

<h2 class="section-title">

Tambah Link

</h2>

<div class="form-group">

<label for="link-title">
Judul Link
</label>

<input
type="text"
id="link-title"
placeholder="Instagram">

</div>

<div class="form-group">

<label for="link-url">
URL
</label>

<input
type="url"
id="link-url"
placeholder="https://">

</div>

<button
type="button"
class="btn btn-primary"
onclick="addNewLink()">

Tambah Link

</button>

<hr>

<h2 class="section-title">

Daftar Link

</h2>

<div id="links-list">

<p>
Memuat data...
</p>

</div>

</section>

</div>

</div>

</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>

</body>
</html>
